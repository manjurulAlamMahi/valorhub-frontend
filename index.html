<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary ───────────────────────────────────────────────────────── -->
    <title>
      ValorHub — They Served Their Country. Now, They're Here to Serve You.
    </title>
    <meta
      name="description"
      content="Connect with verified veteran-owned businesses across the US. Trusted professionals for home services, contracting, and more — all vetted through ID.me."
    />
    <meta name="theme-color" content="#BE1E2D" />

    <!-- ── Favicons ───────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/icons/favicon-96x96.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#BE1E2D" />

    <!-- ── PWA manifest ───────────────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- ── Windows tiles ─────────────────────────────────────────────────── -->
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="msapplication-TileColor" content="#1A1035" />
    <meta name="msapplication-TileImage" content="/icons/mstile-150x150.png" />

    <!-- ── Open Graph ────────────────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://valorhub.com/" />
    <meta property="og:site_name" content="ValorHub" />
    <meta
      property="og:title"
      content="ValorHub — They Served Their Country. Now, They're Here to Serve You."
    />
    <meta
      property="og:description"
      content="Connect with verified veteran-owned businesses across the US. Trusted professionals for home services, contracting, and more."
    />
    <meta property="og:image" content="https://valorhub.com/og/home.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ValorHub — Veteran-Owned Business Marketplace"
    />

    <!-- ── Twitter / X ───────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@valorhub" />
    <meta
      name="twitter:title"
      content="ValorHub — They Served Their Country. Now, They're Here to Serve You."
    />
    <meta
      name="twitter:description"
      content="Connect with verified veteran-owned businesses across the US. Trusted professionals for home services, contracting, and more."
    />
    <meta name="twitter:image" content="https://valorhub.com/og/home.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
